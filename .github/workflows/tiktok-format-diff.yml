name: Temporary TikTok formatting check
on:
  push:
    branches:
      - feature/tiktok-animated-scenes-20261103
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Show precise Prettier patch for changed TikTok files
        run: |
          cd frontend
          npx prettier --write src/features/tiktok-media/slide-canvas.ts src/features/tiktok-media/TikTokMediaPage.tsx
          echo "FORMAT_PATCH_START"
          git --no-pager diff -- src/features/tiktok-media/slide-canvas.ts src/features/tiktok-media/TikTokMediaPage.tsx
          echo "FORMAT_PATCH_END"
