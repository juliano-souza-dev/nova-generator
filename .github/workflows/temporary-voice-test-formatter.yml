name: Temporary voice test format
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Print exact formatted test content
        run: |
          node --input-type=module <<'JS'
          import * as prettier from 'prettier';
          import { readFileSync } from 'node:fs';
          const path = 'src/features/voices/VoicesPage.test.tsx';
          const original = readFileSync(path, 'utf8');
          const config = await prettier.resolveConfig(path);
          const formatted = await prettier.format(original, {...config, filepath: path});
          console.log('VOICE_TEST_FORMAT=' + JSON.stringify({path: 'frontend/' + path, formatted}));
          JS
