name: Temporary unified preparation formatting
on:
  push:
    branches: [feat/early-unified-ai-preparation]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/early-unified-ai-preparation
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Apply repository Prettier rules
        run: |
          npx prettier --write \
            src/features/editorial/EditorialPage.tsx \
            src/features/media/MediaPage.tsx \
            src/features/shadowing/ShadowingPage.tsx \
            src/lib/studio-api.ts
        working-directory: frontend
      - name: Commit formatting on the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/features/editorial/EditorialPage.tsx \
            frontend/src/features/media/MediaPage.tsx \
            frontend/src/features/shadowing/ShadowingPage.tsx \
            frontend/src/lib/studio-api.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: apply repository Prettier rules to unified preparation"
            git push origin HEAD:feat/early-unified-ai-preparation
          fi
