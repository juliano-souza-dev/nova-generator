name: Desktop Windows

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "frontend/**"
      - "src/nova_generator/**"
      - "pyproject.toml"
      - "alembic.ini"
      - "migrations/**"
      - ".github/workflows/desktop-windows.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "frontend/**"
      - "src/nova_generator/**"
      - "pyproject.toml"
      - ".github/workflows/desktop-windows.yml"
  workflow_dispatch:

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install desktop tooling
        working-directory: desktop
        run: npm install

      - name: Build backend wheel for the installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/src-tauri/resources/python | Out-Null
          python -m pip wheel --no-deps . --wheel-dir desktop/src-tauri/resources/python
          New-Item -ItemType Directory -Force desktop/src-tauri/resources/backend | Out-Null
          Copy-Item alembic.ini desktop/src-tauri/resources/backend/alembic.ini
          Copy-Item migrations desktop/src-tauri/resources/backend/migrations -Recurse
          Compress-Archive -Path desktop/src-tauri/resources/backend/* -DestinationPath desktop/src-tauri/resources/backend-assets.zip -Force

      - name: Build Windows installers
        working-directory: desktop
        run: npm run tauri -- build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: nova-generator-windows-installers
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
