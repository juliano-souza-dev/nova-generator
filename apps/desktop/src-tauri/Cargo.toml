[package]
name = "nova-generator"
version = "0.1.0"
description = "Nova Generator desktop application"
authors = ["JulianoDev"]
edition = "2021"

[lib]
name = "nova_generator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls", "multipart"] }
shared-runtime-manager = { git = "https://github.com/juliano-souza-dev/shared-runtime-manager-", rev = "6aeadf2baf8d2b10c8c193105897082c3c84c23c", version = "0.6.0" }
tauri = { version = "2", features = ["protocol-asset"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri-plugin-dialog = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }
