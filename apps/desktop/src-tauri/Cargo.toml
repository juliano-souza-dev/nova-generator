[package]
name = "nova-generator"
version = "0.1.0"
description = "Nova Generator desktop application"
authors = ["JulianoDev"]
edition = "2021"

[lib]
name = "nova_generator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls", "multipart"] }
base64 = "0.22"
tokio = { version = "1", features = ["time"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tracing-appender = "0.2"
anyhow = "1"
dirs = "6"
sha1 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri = { version = "2", features = ["protocol-asset"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri-plugin-dialog = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
tempfile = "3"
