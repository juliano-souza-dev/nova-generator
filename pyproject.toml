[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nova-generator"
version = "0.1.0"
description = "Backend modular do Nova Generator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "genanki>=0.13,<1",
  "groq>=0.18,<2",
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.20,<1",
  "jsonschema>=4.23,<5",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "yt-dlp>=2025.1.15,<2027",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
asr = [
  "faster-whisper>=1.1,<2",
]
dev = [
  "httpx>=0.28,<1",
  "pyright>=1.1.390,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nova_generator"]

[tool.vercel]
entrypoint = "main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src"]
exclude = ["legacy", "frontend", "tests", "editorial_contracts"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
